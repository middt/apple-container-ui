name: CI — Build & Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    paths-ignore:
      - "Casks/**"
      - "**.md"

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Swift & macOS Version
        run: |
          sw_vers
          swift --version

      - name: Run Unit Tests
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh

      - name: Build & Sign Vessel.app Bundle
        run: |
          chmod +x ./scripts/bundle-app.sh
          ./scripts/bundle-app.sh
          ls -lh dist/Vessel.app/Contents/MacOS/Vessel

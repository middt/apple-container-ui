version: "3.9"
services:
  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    cpus: 2
    mem_limit: 512m
    ports:
      - "8090:8080/http"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
  api-gateway-nginx:
    image: nginx:1.27-alpine
    cpus: 2
    mem_limit: 512m
    ports:
      - "8080:80/http"
      - "8443:443/https"
    environment:
      - UPSTREAM_HTTPBIN=http://httpbin.container.local:8080
    depends_on:
      - httpbin
  redis-valkey-cache:
    image: valkey/valkey:8.0-alpine
    cpus: 2
    mem_limit: 1024m
    ports:
      - "6379:6379/tcp"


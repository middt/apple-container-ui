version: "3.9"
services:
  postgres-primary:
    image: postgres:17.2-alpine
    cpus: 4
    mem_limit: 2048m
    ports:
      - "5432:5432/tcp"
    environment:
      - POSTGRES_DB=apple_cloud_dev
      - POSTGRES_USER=postgres
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
  adminer-web:
    image: adminer:4.8.1-standalone
    cpus: 1
    mem_limit: 256m
    ports:
      - "8095:8080/http"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres-primary.container.local
    depends_on:
      - postgres-primary

